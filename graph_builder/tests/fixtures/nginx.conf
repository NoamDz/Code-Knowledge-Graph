worker_processes auto;

http {
    lua_package_path "/srv/app/lua/?.lua;/srv/app/lua/?/init.lua;;";
    lua_package_cpath "/srv/app/lua/?.so;;";

    lua_shared_dict rate_limit 10m;
    lua_shared_dict app_cache 50m;
    lua_shared_dict locks 1m;

    init_by_lua_block {
        require "resty.core"
        local config = require "app.config"
        config.init()
    }

    init_worker_by_lua_block {
        local timer = require "app.timer"
        timer.start_background_jobs()
    }

    server {
        listen 8080;

        location /api/auth/login {
            access_by_lua_block {
                local rate = require "app.rate_limiter"
                rate.check_rate_limit(ngx.var.remote_addr)
            }
            content_by_lua_file /srv/app/lua/handlers/auth_login.lua;
        }

        location /api/auth/logout {
            access_by_lua_block {
                local auth = require "app.auth"
                auth.require_login()
            }
            content_by_lua_file /srv/app/lua/handlers/auth_logout.lua;
        }

        location /api/users {
            access_by_lua_block {
                local auth = require "app.auth"
                auth.require_login()
            }
            content_by_lua_file /srv/app/lua/handlers/users.lua;
        }

        location ~ ^/api/users/(\d+)$ {
            set $user_id $1;
            access_by_lua_block {
                local auth = require "app.auth"
                auth.require_login()
            }
            content_by_lua_file /srv/app/lua/handlers/user_detail.lua;
        }

        location /health {
            content_by_lua_block {
                ngx.say("ok")
            }
        }

        location /static/ {
            alias /srv/app/static/;
        }

        header_filter_by_lua_block {
            local headers = require "app.response_headers"
            headers.set_defaults()
        }
    }
}
