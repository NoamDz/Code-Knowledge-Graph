lua_shared_dict api_cache 20m;

upstream go_backend {
    server unix:/tmp/go-svc.sock;
}

upstream python_backend {
    server 127.0.0.1:8081;
}

location /api/users {
    access_by_lua_file /srv/app/lua/middleware/auth.lua;
    content_by_lua_file /srv/app/lua/handlers/users.lua;
}

location /api/orders {
    access_by_lua_block {
        local auth = require "middleware.auth"
        auth.require_login()
    }
    content_by_lua_file /srv/app/lua/handlers/orders.lua;
}

location /api/go-service {
    proxy_pass http://go_backend;
}

location /api/python-service {
    proxy_pass http://python_backend/api;
}
