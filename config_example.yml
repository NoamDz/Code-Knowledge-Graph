# BOB Code Knowledge Graph — Configuration
# Copy to config.yml and adjust paths for your codebase

# Point at src/ — this is where the actual code lives.
# Everything outside (Docker configs, scripts, etc.) is ignored.
repo_root: /Users/il021250/dev/pinpoint/src

# --------------------------------------------------------------------------
# nginx.conf — only exists inside the running container.
# Two options:
#
# Option A: Extract it from the container (recommended):
  # ./scripts/extract_nginx_conf.sh
#   Then uncomment the line below:
nginx_conf: /data/kashmir/pinpoint/shared/nginx/config/nginx_pinpoint.conf
#
# Option B: Skip nginx.conf entirely and specify lua_package_paths manually.
#   The graph will still index all Lua files, imports, and function calls —
#   you just won't get Endpoint / NginxPhase nodes for request tracing.
# --------------------------------------------------------------------------
# nginx_conf: ./extracted_nginx.conf

# Base path for resolving nginx include directives.
# If your nginx.conf uses absolute container paths like:
#   include /data/app/nginx/conf.d/*.conf;
# Set this to the local path that corresponds to the container root.
# The parser will try to resolve includes relative to this path.
# nginx_base_path: /Users/il021250/dev/pinpoint/src

# Lua package paths — set these manually since nginx.conf isn't available.
# These tell the resolver how require("resty.auth") maps to files.
# Look at the generation script to find the lua_package_path value.
lua_package_paths:
  # /data/kashmir/pinpoint/core/?/lua/init.lua
  - "core/?/lua/init.lua"
  # /data/kashmir/pinpoint/core/router/?.lua
  - "core/router/?.lua"
  # /data/kashmir/pinpoint/core/router/?/init.lua
  - "core/router/?/init.lua"
  # /data/kashmir/pinpoint/core/?.lua (appears twice in nginx conf)
  - "core/?.lua"
  # /data/kashmir/pinpoint/core/?/init.lua
  - "core/?/init.lua"
  # /data/kashmir/pinpoint/?.lua
  - "?.lua"
  # /data/kashmir/pinpoint/?/init.lua
  - "?/init.lua"

# Memgraph connection
memgraph:
  uri: bolt://localhost:7687
  user: ""
  password: ""

# Directories to skip during scanning
ignore_patterns:
  - node_modules
  - .git
  - __pycache__
  - vendor
  - deps
  - .tox
  - .mypy_cache
  - dist
  - build
  - .eggs
  - .venv
  - venv
  - test
  - tests
  - spec
  - __tests__
  - fixtures
  - mocks