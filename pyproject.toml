[project]
name = "code-graph"
version = "0.1.0"
description = "Code Knowledge Graph for IBM BOB — polyglot codebase indexer"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-lua>=0.2.0",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-javascript>=0.23",
    "neo4j>=5.0",
    "watchdog>=4.0",
    "fastmcp>=0.4",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
code-graph = "graph_builder.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graph_builder*", "mcp_server*", "watcher*"]
